[package]
name = "estela-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle.workspace = true
estela-capture.workspace = true
estela-media.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.14.0", features = ["randr", "composite", "shape"] }
ashpd = { version = "=0.14.0", features = ["screencast", "global_shortcuts"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "sync"] }
futures-util = "=0.3.32"
serde_json.workspace = true
pipewire = "=0.10.1"
wayland-client = { version = "=0.31.15", features = ["system"] }
