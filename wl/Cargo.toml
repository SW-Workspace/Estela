[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "x11", "wayland", "tokio", "image-without-codecs", "canvas", "svg"] }
libm = "=0.2.16"
crc32fast = "=1.5.0"
raw-window-handle = "=0.6.2"

crossbeam-channel = "=0.5.15"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
ulid = { version = "=1.2.1", features = ["serde"] }

estela-model = { path = "crates/estela-model" }
estela-format = { path = "crates/estela-format" }
estela-timeline = { path = "crates/estela-timeline" }
estela-motion = { path = "crates/estela-motion" }
estela-render = { path = "crates/estela-render" }
estela-media = { path = "crates/estela-media" }
estela-media-ffmpeg = { path = "crates/estela-media-ffmpeg" }
estela-capture = { path = "crates/estela-capture" }
estela-audio = { path = "crates/estela-audio" }
estela-engine = { path = "crates/estela-engine" }
estela-library = { path = "crates/estela-library" }
estela-platform-win = { path = "crates/estela-platform-win" }
estela-platform-linux = { path = "crates/estela-platform-linux" }
estela-app = { path = "crates/estela-app" }
estela-cli = { path = "crates/estela-cli" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"


# Capture and preview must meet frame deadlines during development.
[profile.dev.package.estela-platform-linux]
opt-level = 2

[profile.dev.package.estela-platform-win]
opt-level = 2

[profile.dev.package.estela-engine]
opt-level = 2
