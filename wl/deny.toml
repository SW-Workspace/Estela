[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0206", reason = "Pinned Iced SVG inherits unmaintained rustybuzz; no safe upgrade is available." },
    { id = "RUSTSEC-2026-0192", reason = "Pinned Iced inherits unmaintained ttf-parser; no safe upgrade is available." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [{ crate = "option-ext@0.2.0", allow = ["MPL-2.0"] }]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses.private]
ignore = true
