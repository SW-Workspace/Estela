name: Windows and Linux — structure
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-latest
            os: windows-latest
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: fedora-44
            os: ubuntu-24.04
            image: registry.fedoraproject.org/fedora:44
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    defaults:
      run:
        working-directory: wl
    steps:
      - name: Install Fedora build requirements
        if: matrix.image != ''
        working-directory: .
        run: >-
          dnf install -y git /usr/bin/curl ca-certificates gcc clang clang-devel pkgconf-pkg-config
          pipewire-devel libxkbcommon-devel wayland-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install Ubuntu build requirements
        if: runner.os == 'Linux' && matrix.image == ''
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libpipewire-0.3-dev libclang-dev pkg-config libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo xtask check-deps
      - run: cargo xtask check-sqlx
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
